function render(){
 const f=document.getElementById('test');
 data.forEach((d,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<div class="q">'+(i+1)+'. '+d.en+'</div><div class="kn">'+d.kn+'</div>'+
   d.opts.map((o,j)=>'<label class="opt"><input type="radio" name="q'+(i+1)+'" value="'+String.fromCharCode(65+j)+'">'+String.fromCharCode(65+j)+') '+o+'</label>').join('');
  f.appendChild(c);
 });
}
function grade(){
 let correct=0,wrong=0,unanswered=0,review='';
 data.forEach((d,i)=>{
  const n=i+1,x=document.querySelector('input[name="q'+n+'"]:checked'),u=x?x.value:null;
  let cls='correct',lab='Correct';
  if(!u){unanswered++;cls='unanswered';lab='Unanswered';}
  else if(u===d.ans){correct++;}else{wrong++;cls='wrong';lab='Wrong';}
  const ci=d.ans.charCodeAt(0)-65,ui=u?u.charCodeAt(0)-65:-1;
  review+='<div class="review '+cls+'"><b>Q'+n+' — '+lab+'</b>'+
   '<div>Your answer: '+(u?u+') '+d.opts[ui]:'Not answered')+'</div>'+
   '<div class="answer">Correct answer: '+d.ans+') '+d.opts[ci]+'</div></div>';
 });
 const neg=wrong*.25,score=correct-neg,r=document.getElementById('result');
 r.style.display='block';r.innerHTML='<h2>Result / ಫಲಿತಾಂಶ</h2>'+
 '<p>Correct: <b>'+correct+'</b> | Wrong: <b>'+wrong+'</b> | Unanswered: <b>'+unanswered+'</b></p>'+
 '<p>Negative: <b>'+neg.toFixed(2)+'</b></p><h3>Final Score: '+score.toFixed(2)+' / 100</h3>'+
 '<hr><h3>Answer Review / ಉತ್ತರ ಪರಿಶೀಲನೆ</h3>'+review;
 window.scrollTo({top:0,behavior:'smooth'});
}
render();
</script></body></html>
