const questions = [
  ...DATA.paper1.map((x,i)=>({...x, no:i+1, paper:1})),
  ...DATA.paper2.map((x,i)=>({...x, no:i+101, paper:2}))
];
const answers = Array(200).fill(null);
let submitted=false, remaining=4*60*60, timerHandle=null;

function render(filter="all") {
  const box=document.getElementById("questions");
  box.innerHTML="";
  questions.forEach((q,idx)=>{
    if(filter==="p1" && q.paper!==1) return;
    if(filter==="p2" && q.paper!==2) return;
    const card=document.createElement("div");
    card.className="qcard";
    card.id="q"+idx;
    const opts=q.opts.map((o,j)=>`
      <label class="opt" id="o-${idx}-${j}">
        <input type="radio" name="q${idx}" value="${j}" ${answers[idx]===j?"checked":""} ${submitted?"disabled":""}>
        <b>${String.fromCharCode(65+j)}.</b> ${escapeHtml(o)}
      </label>`).join("");
    card.innerHTML=`<div class="qno">Q${q.no} • Paper ${q.paper}</div>
      <div class="qtext">${escapeHtml(q.en)}</div>
      <div class="kn">${escapeHtml(q.kn)}</div>
      ${opts}
      <div class="topic">${escapeHtml(q.topic)}</div>`;
    box.appendChild(card);
  });
  if(!submitted) {
    document.querySelectorAll('input[type=radio]').forEach(el=>el.addEventListener('change',e=>{
      const idx=Number(e.target.name.slice(1)); answers[idx]=Number(e.target.value);
      updateProgress();
      document.querySelectorAll(`[id^="o-${idx}-"]`).forEach(x=>x.classList.remove("selected"));
      document.getElementById(`o-${idx}-${answers[idx]}`).classList.add("selected");
    }));
  }
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function updateProgress(){document.getElementById("progress").textContent=`Answered: ${answers.filter(x=>x!==null).length} / 200`;}
function tick(){
  if(submitted) return;
  remaining--;
  if(remaining<=0){remaining=0; updateTimer(); submit(true); return;}
  updateTimer();
}
function updateTimer(){
  const h=Math.floor(remaining/3600), m=Math.floor((remaining%3600)/60), s=remaining%60;
  document.getElementById("timer").textContent=[h,m,s].map((x,i)=>String(x).padStart(2,"0")).join(":");
  if(remaining<=300) document.getElementById("timer").style.background="#ffe1e1";
}
function submit(auto=false){
  if(submitted) return;
  if(!auto && !confirm("Submit the final 200-question mock now? You cannot change answers after submission.")) return;
  submitted=true; clearInterval(timerHandle);
  let correct=0, wrong=0, unanswered=0;
  questions.forEach((q,i)=>{
    if(answers[i]===null) unanswered++;
    else if(answers[i]===q.ans) correct++;
    else wrong++;
  });
  const score=correct - wrong*0.25;
  const pct=(score/200*100);
  const result=document.getElementById("result");
  result.style.display="block";
  result.innerHTML=`<div class="score">${score.toFixed(2)} / 200</div>
    <div><span class="stat">✅ Correct: ${correct}</span>
    <span class="stat">❌ Wrong: ${wrong}</span>
    <span class="stat">⭕ Unanswered: ${unanswered}</span>
    <span class="stat">📊 Score %: ${pct.toFixed(2)}%</span></div>
    <p><b>${auto?"⏰ Time ended — the test was auto-submitted.":"🎯 Test submitted successfully."}</b> Scroll down to see your selected answer and the correct answer for every question.</p>`;
  render("all");
  questions.forEach((q,i)=>{
    const card=document.getElementById("q"+i);
    const review=document.createElement("div");
    const state=answers[i]===null?"unanswered":answers[i]===q.ans?"correct":"wrong";
    review.className="review "+state;
    const selected=answers[i]===null?"Not answered":String.fromCharCode(65+answers[i])+". "+q.opts[answers[i]];
    const correctAns=String.fromCharCode(65+q.ans)+". "+q.opts[q.ans];
    review.innerHTML=`<b>Review:</b> <span class="${state==="correct"?"selgood":state==="wrong"?"selbad":""}">Your answer: ${escapeHtml(selected)}</span><br>
      <span class="selgood">Correct answer: ${escapeHtml(correctAns)}</span>`;
    card.appendChild(review);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}
document.getElementById("submitBtn").addEventListener("click",()=>submit(false));
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active")); t.classList.add("active"); render(t.dataset.sec);
}));
render(); updateProgress(); updateTimer(); timerHandle=setInterval(tick,1000);
</script>
</body>
